# ==========================================
# RFM Stage 2: Unified Pipeline 配置文件
# ==========================================

# 1. 数据集配置 (Data Configuration)
data:
  # 训练数据项目路径 (支持多个项目)
  train_dirs:
    - "D:/YihengZhu/jbgs-lma/proj-phase1/eclipse-models/1c/water_flooding"
  train_names:
    - "BYEPD93"

  # 特征字段
  dynamic_fields: ["PRESSURE", "SWAT"]
  static_fields: ["PORO", "PERMX"]

  # 滑动窗口设置
  nt_width: 10          # Transformer 一次前向看到的历史时间步长度
  stride: 1             # 窗口滑动的步长

  # 物理网格参数 (需与 Stage 1 对齐)
  n_theta: 26
  n_R: 10
  model_nz: 40
  maxR: 1000.0
  total_z_depth: 50.0

# 2. 训练超参数 (Training Hyperparameters)
training:
  batch_size: 2
  max_epochs: 100
  learning_rate: 0.0001
  nums_loading_projects: 2 # 内存中并发缓存的项目数量

# 3. 预训练权重路径 (Stage 1 Checkpoints) - 🌟 已修复：拆分 poro 和 perm
stage1_checkpoints:
  vq_vae_path: "checkpoints/vq_vae/best_model.ckpt"
  geo_vae_poro_path: "checkpoints/geo_vae/poro_best_model.ckpt"
  geo_vae_perm_path: "checkpoints/geo_vae/perm_best_model.ckpt"

# 4. Stage 1 子模型初始化配置 - 🌟 已补全：供 pt_train 自动实例化模型使用
vq_vae_config:
  in_channels: 5
  hidden_dim: 32
  latent_dim: 64
  num_embeddings: 1024
  commitment_cost: 0.25
  num_res_blocks: 2
  num_attn_heads: 8
  compress_shape: [2, 2, 2] # 空间压缩比例

geo_vae_poro_config:
  poro_min: 0.0
  poro_max: 0.4
  latent_channels: 32

geo_vae_perm_config:
  perm_min: 0.1
  perm_max: 10000.0
  latent_channels: 160

# 5. Stage 2 Transformer 引擎配置 - 🌟 已修复：整合进独立字典并补全必要参数
transformer_config:
  vocab_size: 1025      # 1024 + 1(PAD/Mask token)
  d_model: 512
  num_heads: 8
  head_splits: [4, 2, 8]  # 注意: 请确保你的 3 个特征流分配的注意力头数之和不大于 d_model 的容量
  num_layers: 6
  hidden_dim: 1024
  max_nt_width: 10        # 与 data.nt_width 保持一致或更大
  Ld: 650                 # 🌟 注意: 这是 Latent 空间的 Token 数量! (例如 nz_lat * n_theta_lat * n_R_lat = 20 * 13 * 5 = 1300 / 2 = 650，请根据实际压缩后计算)
  grid_shape: [20, 13, 5] # 🌟 注意: 这是 Latent 空间的网格形状! [nz_lat, n_theta_lat, n_R_lat]

# 6. Pipeline 顶层控制参数
model:
  # 动态特征维度 (井控指令的维度)
  dynamic_feature_dim: 12

  # 模式开关
  freeze_vqvae: true    # 训练 Stage 2 时，是否冻结 VQ-VAE
  freeze_poro_vae: true # 训练 Stage 2 时，是否冻结 Geo-VAE